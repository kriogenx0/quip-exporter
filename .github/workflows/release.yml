# Builds QuipExporter on a GitHub-hosted Mac and attaches it to every GitHub release.
#
#   release published     -> QuipExporter-<version>.dmg attached to that release
#   manual run (tag)      -> same, for an existing release (re-publish an old one)
#   PR touching this file -> dry run; the .dmg is a workflow artifact (Actions tab)
#
# Without signing secrets the app is signed ad hoc, so the first launch on
# another Mac needs right-click > Open. Add these repository (or organization)
# secrets to get a Developer ID signed and notarized build that opens normally:
#
#   MACOS_CERTIFICATE_P12       base64 of a "Developer ID Application" .p12
#   MACOS_CERTIFICATE_PASSWORD  password of that .p12
#   APPLE_TEAM_ID               e.g. K2F4FTM2XQ
#   APPLE_ID                    Apple ID email used for notarization
#   APPLE_APP_PASSWORD          app-specific password for that Apple ID
#
# Optional: PERFCT_INK_DEPLOY_TOKEN (a fine-grained token with Contents
# read/write on perfct-ink/perfct.ink) rebuilds perfctink.com right after the
# upload, so the new download link shows up immediately instead of at the
# site's next scheduled rebuild.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and attach to
        required: true
  pull_request:
    paths: [.github/workflows/release.yml]

permissions:
  contents: write

defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  APP_NAME: QuipExporter
  # Bundles to ship, one per line, relative to the repo root.
  ARTIFACTS: |
    build/QuipExporter.app

jobs:
  release:
    runs-on: macos-26
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      HAS_SIGNING: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
      HAS_NOTARY: ${{ secrets.APPLE_ID != '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || '' }}

      - name: Version
        run: |
          if [ -n "$TAG" ]; then VERSION="${TAG#v}"; else VERSION="0.0.0-${GITHUB_SHA::7}"; fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          xcodebuild -version

      - name: Build
        run: |
          make publish

      - name: Stamp version
        run: |
          # Release tags like v1.4.2 become the app's version; other tags keep the project's.
          if [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
            while IFS= read -r a; do
              [ -n "$a" ] || continue
              plutil -replace CFBundleShortVersionString -string "$VERSION" "$a/Contents/Info.plist"
              plutil -replace CFBundleVersion -string "$GITHUB_RUN_NUMBER" "$a/Contents/Info.plist"
            done <<< "$ARTIFACTS"
          fi

      - name: Import Developer ID certificate
        if: env.HAS_SIGNING == 'true'
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -m1 'Developer ID Application' | sed -E 's/.*"(.*)"/\1/')"
          [ -n "$IDENTITY" ] || { echo "::error::No Developer ID Application identity in MACOS_CERTIFICATE_P12"; exit 1; }
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Sign
        run: |
          # Inside-out: nested Mach-O files and bundles first, deepest first, then the
          # bundle itself. Existing entitlements (sandbox, extensions) are kept.
          IDENTITY="${SIGN_IDENTITY:--}"
          FLAGS=(--force --preserve-metadata=entitlements,requirements,flags --sign "$IDENTITY")
          [ "$IDENTITY" = "-" ] || FLAGS+=(--timestamp --options runtime)
          while IFS= read -r a; do
            [ -n "$a" ] || continue
            [ -d "$a" ] || { echo "::error::Build did not produce $a"; exit 1; }
            find "$a" -mindepth 1 \( -type d \( -name '*.app' -o -name '*.appex' -o -name '*.framework' \
                -o -name '*.xpc' -o -name '*.component' -o -name '*.vst3' -o -name '*.plugin' \) \
                -o -type f \( -name '*.dylib' -o -perm -u+x \) \) -print0 |
              while IFS= read -r -d '' p; do
                if [ -f "$p" ] && ! file -b "$p" | grep -q 'Mach-O'; then continue; fi
                printf '%s\t%s\n' "$(tr -cd / <<< "$p" | wc -c)" "$p"
              done | sort -rn | cut -f2- |
              while IFS= read -r p; do codesign "${FLAGS[@]}" "$p"; done
            codesign "${FLAGS[@]}" "$a"
            codesign --verify --deep --strict --verbose=2 "$a"
          done <<< "$ARTIFACTS"

      - name: Package
        run: |
          DMG="dist/$APP_NAME-$VERSION.dmg"
          mkdir -p dist stage
          while IFS= read -r a; do
            [ -n "$a" ] || continue
            ditto "$a" "stage/$(basename "$a")"
          done <<< "$ARTIFACTS"
          if ls stage | grep -q '\.app$'; then ln -s /Applications stage/Applications; fi
          hdiutil create -volname "$APP_NAME" -srcfolder stage -ov -format UDZO "$DMG" -quiet
          [ -z "$SIGN_IDENTITY" ] || codesign --sign "$SIGN_IDENTITY" --timestamp "$DMG"
          echo "DMG=$DMG" >> "$GITHUB_ENV"

      - name: Notarize
        if: env.HAS_SIGNING == 'true' && env.HAS_NOTARY == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool submit "$DMG" --wait \
            --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$TEAM_ID"
          xcrun stapler staple "$DMG"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ env.VERSION }}
          path: dist/*

      - name: Attach to release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --clobber

      - name: Rebuild perfctink.com
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ secrets.PERFCT_INK_DEPLOY_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "PERFCT_INK_DEPLOY_TOKEN not set; the site picks this up at its next scheduled rebuild."; exit 0; fi
          gh api repos/perfct-ink/perfct.ink/dispatches -f event_type=app-released \
            -f "client_payload[repo]=$GITHUB_REPOSITORY" -f "client_payload[tag]=$TAG"
